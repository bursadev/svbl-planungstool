services:
  postgres:
    image: postgres:17
    container_name: svbl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-svbl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-svbl}
      POSTGRES_DB: ${DB_NAME:-svbl_planungstool}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - svbl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  svbl-postgres-data:
